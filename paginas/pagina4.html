<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Space Invaders 8‑bit — TEAM_NIKO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Syncopate:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../src/css/pagina4.css">
</head>
<body>

<nav class="max-w-screen-xl mx-auto px-6 py-4 flex justify-between items-center">
    <a href="../index.html" class="font-syncopate text-[10px] tracking-widest text-razerGreen">Volver al Hub</a>
    <div class="font-syncopate text-lg font-bold tracking-widest text-razerGreen">SPACE INVADERS</div>
    <div class="text-[10px] text-gray-600">BY LUIS MIRANDA</div>
</nav>

<div id="game-wrap">
    <!-- start screen shown before first game -->
    <div id="start-screen">
        <h1>SPACE<br>INVADERS</h1>
        <p>click or press start</p>
    </div>
    <div class="hud">
        Puntuacion: <span id="score" class="val">0</span>
        Vidas: <span id="lives" class="val">3</span>
    </div>
    <div class="controls">
        <button id="btn-start" class="btn">Iniciar</button>
        <button id="btn-pause" class="btn">Pausar</button>
        <button id="btn-restart" class="btn">Reiniciar</button>
        <span style="font-size:8px;color:rgba(200,255,200,.6);letter-spacing:.1em;flex-shrink:0;margin-left:4px">|</span>
        <span style="font-size:8px;color:rgba(200,255,200,.6);letter-spacing:.1em;flex-shrink:0">Dif</span>
        <div id="diff-panel" style="display:flex;gap:2px">
            <button class="btn diff-btn" data-diff="easy" title="Facil">F</button>
            <button class="btn diff-btn active" data-diff="medium" title="Medio">M</button>
            <button class="btn diff-btn" data-diff="hard" title="Dificil">D</button>
            <button class="btn diff-btn" data-diff="impossible" title="Imposible">I</button>
        </div>
    </div>

    <div class="canvas-outer" style="position:relative">
        <canvas id="game-canvas" width="1100" height="640" style="position:relative;z-index:20"></canvas>
    </div>
    <div class="touch-controls">
        <button id="touch-left" class="tbtn">Izq</button>
        <button id="touch-fire" class="tbtn">FUEGO</button>
        <button id="touch-right" class="tbtn">Der</button>
    </div>

    <div id="ui-overlay" class="overlay" style="pointer-events:none;display:none">
        <div id="modal" class="modal">
            <h2 id="modal-title" style="color:var(--green);font-family:'Syncopate';margin-bottom:8px">Ganaste</h2>
            <p id="modal-msg" style="margin-bottom:12px">Puntuacion final: <span id="final-score">0</span></p>
            <div style="display:flex;gap:8px;justify-content:center">
                <button id="modal-restart" class="btn" style="pointer-events:auto">Jugar otra</button>
                <a href="../index.html" class="btn" style="pointer-events:auto">Volver</a>
            </div>
        </div>
    </div>
</div>

<script src="../src/js/pagina4.js"></script>
</body>
</html>
