<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Conversor Razer - Niko</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../src/css/pagina3.css">
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=Inter&display=swap" rel="stylesheet">
</head>
<body class="bg-[#050505] text-white font-sans">
    <div class="container mx-auto px-6 py-20 min-h-screen flex flex-col items-center">
        <h1 class="font-syncopate text-razerGreen text-3xl mb-10 tracking-tighter">DATA_CONVERTER_V1</h1>
        
        <div class="bg-[#111111] p-10 border border-razerGreen/30 w-full max-w-md shadow-2xl">
            <label class="block text-xs uppercase tracking-widest text-gray-500 mb-2">Entrada de datos</label>
            <input type="number" id="inputValue" class="w-full bg-black border border-razerGreen/50 p-3 text-razerGreen focus:outline-none mb-6" placeholder="0.00">
            
            <button id="convertBtn" class="w-full bg-razerGreen text-black font-bold py-3 uppercase tracking-widest hover:bg-white transition-colors">
                Ejecutar Conversión
            </button>
            
            <div id="resultArea" class="mt-10 p-4 border-t border-white/10 hidden">
                <span class="text-xs text-gray-500 uppercase">Resultado:</span>
                <p id="resultValue" class="text-2xl font-syncopate text-razerGreen mt-2">--</p>
            </div>
        </div>
        
        <a href="../index.html" class="mt-10 text-xs text-gray-500 hover:text-razerGreen transition-all uppercase tracking-widest">< Volver al Sistema</a>
    </div>

    <script src="../src/js/pagina3.js"></script>
</body>
</html>
